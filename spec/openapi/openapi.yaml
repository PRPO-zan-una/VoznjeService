openapi: "3.0.3"
info:
  title: "Voznje Service API"
  description: "Sprejem podatkov o vožnjah iz naprave in prikaz statistike."
  version: "1.0.0"
servers:
  - url: "http://localhost:8081/api/v1"

paths:
  /uporabnik/{uporabnikId}/avto/{avtoId}/voznje:
    parameters:
      - $ref: '#/components/parameters/UporabnikId'
      - $ref: '#/components/parameters/AvtoId'
    post:
      tags: [Voznje]
      summary: Posiljanje podatkov o voznjah
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoznjaInput'
      responses:
        '201':
          description: Journey stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voznja'
        '400':
          description: Invalid input
        '404':
          description: User or car not found
    get:
      tags: [Voznje]
      summary: Branje seznam vozenj
      parameters:
        - name: od
          in: query
          schema:
            type: string
            format: date
        - name: do
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Statistika voznj
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoznjeStatistika'
        '404':
          description: User or car not found

components:
  parameters:
    UporabnikId:
      name: uporabnikId
      in: path
      required: true
      description: User ID
      schema:
        type: string
        format: uuid
    AvtoId:
      name: avtoId
      in: path
      required: true
      description: Car ID
      schema:
        type: string
        format: uuid

  schemas:
    VoznjaInput:
      type: object
      required:
        - prevozena_razdalja
        - povprecna_hitrost
        - povprecna_poraba
        - cas
        - datum
        - avto_id
        - uporabnik_id
      properties:
        prevozena_razdalja:
          type: integer
          format: int64
          description: Distance travelled
          example: 12400
        povprecna_hitrost:
          type: number
          format: double
          description: Average speed
          example: 38.5
        povprecna_poraba:
          type: number
          format: double
          description: Average fuel consumption
          example: 6.8
        cas:
          type: string
          format: date-time
          example: '2026-11-03T12:36:00Z'
        datum:
          type: string
          format: date
          example: '2026-11-03'
        avto_id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        uporabnik_id:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7

    Voznja:
      allOf:
        - $ref: '#/components/schemas/VoznjaInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              example: 9b2f1c3e-6a4d-4e8b-8c1a-2d5e7f9a0b1c

    VoznjeStatistika:
      type: object
      properties:
        stevilo_voznj:
          type: integer
          example: 25
        skupna_razdalja:
          type: integer
          format: int64
          example: 310500
        povprecna_hitrost:
          type: number
          format: double
          example: 41.2
        povprecna_poraba:
          type: number
          format: double
          example: 7.1
        voznje:
          type: array
          items:
            $ref: '#/components/schemas/Voznja'